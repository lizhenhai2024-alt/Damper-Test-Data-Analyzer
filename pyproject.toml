[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdc-test-data-analyzer"
version = "1.0.0"
description = "CDC damper test data analyzer for center-stroke force evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "olefile>=0.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["PySide6>=6.7", "pyqtgraph>=0.13"]

[project.scripts]
cdc-analyzer = "cdc_analyzer.cli:main"
cdc-analyzer-gui = "cdc_analyzer.gui_release_v092:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cdc_analyzer = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
